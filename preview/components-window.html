<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>html,body{margin:0}body{background:var(--os-bg);padding:24px 28px;font-family:var(--font-mono)}
[data-lucide] svg{width:100%;height:100%}</style></head>
<body>
  <div style="font-size:12px;color:var(--fg-3);text-transform:uppercase;letter-spacing:0.22em;margin-bottom:14px">Window chrome</div>
  <div style="width:420px;background:var(--os-surface);border:1px solid var(--os-line);border-radius:14px;box-shadow:var(--shadow-window);overflow:hidden">
    <div style="display:flex;align-items:center;gap:8px;padding:0 12px;height:40px;background:var(--os-surface-2);border-bottom:1px solid var(--os-line)">
      <span style="width:12px;height:12px;border-radius:50%;background:#FF5F57"></span>
      <span style="width:12px;height:12px;border-radius:50%;background:#FEBC2E"></span>
      <span style="width:12px;height:12px;border-radius:50%;background:#28C840"></span>
      <span style="display:flex;align-items:center;gap:7px;margin-left:8px;font-size:12px;color:var(--fg-2)"><i data-lucide="radar" style="width:13px;height:13px;color:var(--noc-phosphor)"></i> supervision.app</span>
    </div>
    <div style="padding:18px;color:var(--fg-2);font-size:13px;font-family:var(--font-display)">Draggable title bar · red dot closes · accent-colored Lucide icon · lowercase <code class="ros-code">app.name</code> title.</div>
  </div>
  <script>lucide.createIcons();</script>
</body></html>
