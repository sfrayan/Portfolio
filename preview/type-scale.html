<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0}body{background:var(--os-bg);padding:24px 28px;font-family:var(--font-display)}
.r{display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid var(--os-line-soft)}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:120px;flex-shrink:0}</style></head>
<body>
  <div style="font-family:var(--font-mono);font-size:12px;color:var(--fg-3);text-transform:uppercase;letter-spacing:0.22em;margin-bottom:14px">Type scale</div>
  <div class="r"><span class="lbl">3xl · 44</span><span style="font-size:44px;font-weight:800;color:var(--fg-1);letter-spacing:-0.02em">Display</span></div>
  <div class="r"><span class="lbl">2xl · 34</span><span style="font-size:34px;font-weight:700;color:var(--fg-1)">Heading</span></div>
  <div class="r"><span class="lbl">lg · 21</span><span style="font-size:21px;font-weight:600;color:var(--fg-1)">Subhead</span></div>
  <div class="r"><span class="lbl">base · 15</span><span style="font-size:15px;color:var(--fg-2)">Body text</span></div>
  <div class="r" style="border:none"><span class="lbl">xs · 12</span><span style="font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:0.22em;color:var(--fg-3)">EYEBROW LABEL</span></div>
</body></html>
