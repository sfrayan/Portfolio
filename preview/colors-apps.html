<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0}body{background:var(--os-bg);padding:24px 28px;font-family:var(--font-mono)}
.sw{height:54px;border-radius:8px;border:1px solid var(--os-line)}
.c{font-size:10.5px;color:var(--fg-3);margin-top:6px}.h{font-size:9.5px;color:var(--fg-4)}
.lab{font-size:11px;color:var(--fg-3);margin:0 0 10px}</style></head>
<body>
  <div style="font-size:12px;color:var(--fg-3);text-transform:uppercase;letter-spacing:0.22em;margin-bottom:14px">App accents · scoped per app</div>
  <p class="lab" style="color:var(--noc-phosphor)">supervision.app — NOC</p>
  <div style="display:flex;gap:10px;margin-bottom:16px">
    <div style="flex:1"><div class="sw" style="background:var(--noc-phosphor);box-shadow:0 0 14px var(--noc-phosphor)"></div><div class="c">phosphor</div><div class="h">#5BF2A8</div></div>
    <div style="flex:1"><div class="sw" style="background:var(--noc-cyan)"></div><div class="c">cyan</div><div class="h">#38E1FF</div></div>
    <div style="flex:1"><div class="sw" style="background:var(--noc-amber)"></div><div class="c">amber</div><div class="h">#F5B544</div></div>
    <div style="flex:1"><div class="sw" style="background:#08100C"></div><div class="c">ground</div><div class="h">#08100C</div></div>
  </div>
  <p class="lab" style="color:var(--twin-signal)">jumeau.app — blueprint</p>
  <div style="display:flex;gap:10px">
    <div style="flex:1"><div class="sw" style="background:var(--twin-signal)"></div><div class="c">signal</div><div class="h">#F0663F</div></div>
    <div style="flex:1"><div class="sw" style="background:var(--twin-teal)"></div><div class="c">teal</div><div class="h">#1FA89B</div></div>
    <div style="flex:1"><div class="sw" style="background:var(--twin-blue)"></div><div class="c">ink-blue</div><div class="h">#6FA8FF</div></div>
    <div style="flex:1"><div class="sw" style="background:#0A1322"></div><div class="c">ground</div><div class="h">#0A1322</div></div>
  </div>
</body></html>
