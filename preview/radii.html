<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0}body{background:var(--os-bg);padding:24px 28px;font-family:var(--font-mono)}
.box{background:var(--os-surface-2);border:1px solid var(--os-line)}
.c{font-size:10.5px;color:var(--fg-3);margin-top:8px;text-align:center}</style></head>
<body>
  <div style="font-size:12px;color:var(--fg-3);text-transform:uppercase;letter-spacing:0.22em;margin-bottom:18px">Corner radii</div>
  <div style="display:flex;gap:22px;align-items:flex-end">
    <div><div class="box" style="width:80px;height:60px;border-radius:6px"></div><div class="c">sm · 6 — chips</div></div>
    <div><div class="box" style="width:80px;height:60px;border-radius:10px"></div><div class="c">md · 10 — cards</div></div>
    <div><div class="box" style="width:80px;height:60px;border-radius:14px"></div><div class="c">lg · 14 — windows</div></div>
    <div><div class="box" style="width:80px;height:60px;border-radius:20px"></div><div class="c">xl · 20</div></div>
    <div><div class="box" style="width:120px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--fg-2);font-size:11px">pill · 999</div><div class="c">pill</div></div>
  </div>
</body></html>
