<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0}body{background:var(--os-bg);padding:26px 28px;font-family:var(--font-mono);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{font-size:13px;border-radius:6px;padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:none;font-weight:600}
.primary{background:var(--coral);color:#2a0d05;box-shadow:var(--glow-coral)}
.ghost{background:var(--os-surface-2);color:var(--fg-1);border:1px solid var(--os-line)}
.mint{background:transparent;color:var(--mint);border:1px solid var(--mint)}
.eb{position:absolute;top:24px;left:28px;font-size:12px;color:var(--fg-3);text-transform:uppercase;letter-spacing:0.22em}</style></head>
<body>
  <div class="eb">Buttons</div>
  <div style="height:18px;width:100%"></div>
  <button class="btn primary">$ ./connect.sh</button>
  <button class="btn ghost">Voir le dépôt</button>
  <button class="btn mint">● live</button>
  <span style="font-family:var(--font-mono);font-size:11px;padding:5px 11px;border-radius:999px;border:1px solid var(--os-line);background:var(--os-surface-2);color:var(--fg-1)">Next.js</span>
  <span style="font-family:var(--font-mono);font-size:11px;padding:5px 11px;border-radius:999px;border:1px solid var(--os-line);background:var(--os-surface-2);color:var(--coral)">React</span>
</body></html>
