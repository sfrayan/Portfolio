<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>html,body{margin:0}body{background:var(--os-bg-deep);padding:34px 28px;font-family:var(--font-mono);display:flex;justify-content:center}
[data-lucide] svg{width:100%;height:100%}
.item{width:46px;height:46px;border-radius:13px;border:1px solid var(--os-line);display:flex;align-items:center;justify-content:center}</style></head>
<body>
  <div style="display:flex;gap:8px;padding:9px 12px;background:var(--glass-bg);backdrop-filter:blur(18px);border:1px solid var(--os-line);border-radius:18px;box-shadow:var(--shadow-lg)">
    <div class="item" style="background:linear-gradient(135deg,#FF6B4A,#C9402A);color:#fff"><i data-lucide="user-round" style="width:21px;height:21px"></i></div>
    <div class="item" style="background:var(--os-surface-2);color:var(--gold)"><i data-lucide="folder" style="width:21px;height:21px"></i></div>
    <div class="item" style="background:#08100C;color:var(--noc-phosphor)"><i data-lucide="radar" style="width:21px;height:21px"></i></div>
    <div class="item" style="background:#0A1322;color:var(--twin-signal)"><i data-lucide="box" style="width:21px;height:21px"></i></div>
    <div class="item" style="background:#0C0A12;color:var(--mint)"><i data-lucide="square-terminal" style="width:21px;height:21px"></i></div>
    <div class="item" style="background:var(--os-surface-2);color:var(--coral)"><i data-lucide="send" style="width:21px;height:21px"></i></div>
  </div>
  <script>lucide.createIcons();</script>
</body></html>
