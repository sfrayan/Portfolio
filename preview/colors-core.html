<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0}body{background:var(--os-bg);padding:24px 28px;font-family:var(--font-mono)}
.sw{flex:1;border-radius:8px;border:1px solid var(--os-line);height:64px}
.c{font-size:10px;color:var(--fg-3);margin-top:6px}.h{font-size:9px;color:var(--fg-4)}</style></head>
<body>
  <div style="font-size:12px;color:var(--fg-3);text-transform:uppercase;letter-spacing:0.22em;margin-bottom:14px">Core · base &amp; surfaces</div>
  <div style="display:flex;gap:10px">
    <div><div class="sw" style="background:var(--os-bg-deep)"></div><div class="c">bg-deep</div><div class="h">#0F0E15</div></div>
    <div><div class="sw" style="background:var(--os-bg)"></div><div class="c">bg</div><div class="h">#15131C</div></div>
    <div><div class="sw" style="background:var(--os-surface)"></div><div class="c">surface</div><div class="h">#1E1B28</div></div>
    <div><div class="sw" style="background:var(--os-surface-2)"></div><div class="c">surface-2</div><div class="h">#262232</div></div>
    <div><div class="sw" style="background:var(--os-surface-3)"></div><div class="c">surface-3</div><div class="h">#2F2A3D</div></div>
    <div><div class="sw" style="background:var(--os-line)"></div><div class="c">line</div><div class="h">#332E42</div></div>
  </div>
  <div style="display:flex;gap:10px;margin-top:14px">
    <div style="flex:1"><div class="sw" style="background:var(--fg-1)"></div><div class="c">fg-1 · text</div></div>
    <div style="flex:1"><div class="sw" style="background:var(--fg-2)"></div><div class="c">fg-2 · secondary</div></div>
    <div style="flex:1"><div class="sw" style="background:var(--fg-3)"></div><div class="c">fg-3 · muted</div></div>
    <div style="flex:1"><div class="sw" style="background:var(--fg-4)"></div><div class="c">fg-4 · faint</div></div>
  </div>
</body></html>
