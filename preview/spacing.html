<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0}body{background:var(--os-bg);padding:24px 28px;font-family:var(--font-mono)}
.bar{background:var(--coral);height:18px;border-radius:3px}
.row{display:flex;align-items:center;gap:14px;margin-bottom:9px}
.t{font-size:11px;color:var(--fg-3);width:64px}</style></head>
<body>
  <div style="font-size:12px;color:var(--fg-3);text-transform:uppercase;letter-spacing:0.22em;margin-bottom:16px">Spacing · 4px grid</div>
  <div class="row"><span class="t">space-1</span><div class="bar" style="width:4px"></div><span style="font-size:11px;color:var(--fg-4)">4px</span></div>
  <div class="row"><span class="t">space-2</span><div class="bar" style="width:8px"></div><span style="font-size:11px;color:var(--fg-4)">8px</span></div>
  <div class="row"><span class="t">space-4</span><div class="bar" style="width:16px"></div><span style="font-size:11px;color:var(--fg-4)">16px</span></div>
  <div class="row"><span class="t">space-6</span><div class="bar" style="width:24px"></div><span style="font-size:11px;color:var(--fg-4)">24px</span></div>
  <div class="row"><span class="t">space-8</span><div class="bar" style="width:32px"></div><span style="font-size:11px;color:var(--fg-4)">32px</span></div>
  <div class="row"><span class="t">space-12</span><div class="bar" style="width:48px"></div><span style="font-size:11px;color:var(--fg-4)">48px</span></div>
  <div class="row"><span class="t">space-16</span><div class="bar" style="width:64px"></div><span style="font-size:11px;color:var(--fg-4)">64px</span></div>
</body></html>
