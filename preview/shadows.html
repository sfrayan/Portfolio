<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0}body{background:var(--os-bg);padding:30px 28px;font-family:var(--font-mono)}
.e{width:140px;height:74px;border-radius:12px;background:var(--os-surface-2);display:flex;align-items:center;justify-content:center;color:var(--fg-3);font-size:11px}
.c{font-size:10.5px;color:var(--fg-3);margin-top:10px}</style></head>
<body>
  <div style="font-size:12px;color:var(--fg-3);text-transform:uppercase;letter-spacing:0.22em;margin-bottom:20px">Elevation &amp; glow</div>
  <div style="display:flex;gap:26px;align-items:flex-start">
    <div><div class="e" style="box-shadow:var(--shadow-sm)">sm</div><div class="c">shadow-sm</div></div>
    <div><div class="e" style="box-shadow:var(--shadow-md)">md</div><div class="c">shadow-md</div></div>
    <div><div class="e" style="box-shadow:var(--shadow-lg)">lg</div><div class="c">shadow-lg · windows</div></div>
    <div><div class="e" style="box-shadow:var(--glow-coral);border:1px solid var(--coral)">glow</div><div class="c">glow-coral</div></div>
  </div>
</body></html>
