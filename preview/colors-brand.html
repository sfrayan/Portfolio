<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0}body{background:var(--os-bg);padding:24px 28px;font-family:var(--font-mono)}
.sw{height:80px;border-radius:10px;border:1px solid var(--os-line);display:flex;align-items:flex-end;padding:8px}
.c{font-size:11px;color:var(--fg-3);margin-top:7px}.h{font-size:10px;color:var(--fg-4)}</style></head>
<body>
  <div style="font-size:12px;color:var(--fg-3);text-transform:uppercase;letter-spacing:0.22em;margin-bottom:14px">Brand &amp; semantics</div>
  <div style="display:flex;gap:12px">
    <div style="flex:1.6"><div class="sw" style="background:var(--coral);box-shadow:var(--glow-coral)"><span style="font-size:11px;color:#2a0d05;font-weight:700">PRIMARY</span></div><div class="c">coral</div><div class="h">#FF6B4A</div></div>
    <div style="flex:1"><div class="sw" style="background:var(--mint)"></div><div class="c">mint · success</div><div class="h">#6EE7B7</div></div>
    <div style="flex:1"><div class="sw" style="background:var(--gold)"></div><div class="c">gold · warning</div><div class="h">#FBBF6B</div></div>
    <div style="flex:1"><div class="sw" style="background:var(--alert)"></div><div class="c">alert · danger</div><div class="h">#FF5470</div></div>
  </div>
</body></html>
