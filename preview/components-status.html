<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0}body{background:var(--os-bg);padding:24px 28px;font-family:var(--font-mono)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.pill{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--os-line);background:var(--os-surface-2);color:var(--fg-2)}</style></head>
<body>
  <div style="font-size:12px;color:var(--fg-3);text-transform:uppercase;letter-spacing:0.22em;margin-bottom:16px">Status · pills · telemetry</div>
  <div style="display:flex;gap:18px;align-items:center;margin-bottom:18px;flex-wrap:wrap">
    <span style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mint)"><span class="dot" style="background:var(--mint);box-shadow:0 0 8px var(--mint)"></span> EN LIGNE</span>
    <span style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--gold)"><span class="dot" style="background:var(--gold)"></span> ◐ wip</span>
    <span style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--alert)"><span class="dot" style="background:var(--alert)"></span> alert</span>
    <span class="pill">Vanilla JS</span><span class="pill" style="color:var(--coral)">Next.js</span><span class="pill">Docker</span>
  </div>
  <div style="max-width:420px">
    <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;color:var(--fg-2)"><span>Wireshark</span><span style="color:var(--noc-phosphor)">96%</span></div>
    <div style="height:4px;background:#0B1B12;border-radius:2px;overflow:hidden;margin-bottom:10px"><div style="width:96%;height:100%;background:var(--noc-phosphor);box-shadow:0 0 6px var(--noc-phosphor)"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;color:var(--fg-2)"><span>React</span><span style="color:var(--noc-cyan)">92%</span></div>
    <div style="height:4px;background:#0B1B12;border-radius:2px;overflow:hidden"><div style="width:92%;height:100%;background:var(--noc-cyan);box-shadow:0 0 6px var(--noc-cyan)"></div></div>
  </div>
</body></html>
